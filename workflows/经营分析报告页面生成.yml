            # 分析原则


            所有结论必须来自输入。


            但是：


            不要机械复述指标。


            不要写：


            “8月XX，9月XX，10月XX”


            而应该转换为：


            “规模正在收缩”

            “效率正在改善”

            “结构依赖正在增强”



            # 数据缺失规则


