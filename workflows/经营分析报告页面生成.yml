        template: "{% raw %}\r\n# S3 五屏共用固定上下文\r\n\r\n## 完整五屏生成框架\r\n# S3 渠道结构诊断报告生成框架\r\
          \n\r\n## 1. 文档目标\r\n\r\n一期仅生成 S3 渠道结构诊断报告，不生成 S1、S2、S4 报告内容。\r\n\r\n本框架将\
          \ S3 报告拆分为五个屏幕：\r\n\r\n1. 渠道全景\r\n2. 品类营收结构\r\n3. 获客成本信号\r\n4. 投放有效性\r\n\
          5. 总结\r\n\r\n原框架中的「品类 × 渠道依赖度」「内部渠道」「转介绍」三屏，因当前指标层缺少 `acquisition_source_type`、月\
          \ × 品类 × 渠道交叉聚合、`customer_id`、`referral_*` 等支撑字段，一期不生成，也不作为占位屏输出。待相应字段接入后再补齐为独立屏。\r\
          \n\r\n本框架只定义报告生成方式，不预先编写实际诊断结论。核心要求如下：\r\n\r\n- 每个结论必须可追溯到指标数据或规则结果。\r\n\
          - LLM 不得创造业务原因。\r\n- 所有解释性推理必须明确标注“推断”。\r\n- 指标由指标层计算，规则由 Rule Engine 判断，LLM\
          \ 只负责受约束的语言组织。\r\n\r\n---\r\n\r\n## 2. 总体生成原则\r\n\r\n### 2.1 结论类型\r\n\r\n\
          系统只允许输出三类结论。\r\n\r\n| 结论类型 | 含义 | 固定前缀 | 必须携带的信息 |\r\n| --- | --- | ---\
          \ | --- |\r\n| 数据事实 | 指标层直接计算所得 | `【数据事实】` | 指标、数值、单位、期间、维度、数据引用 |\r\n|\
          \ 规则结论 | Rule Engine 已执行并返回 | `【规则结论】` | `rule_id`、命中状态、阈值、指标快照、证据 |\r\n\
          | 受限推断 | 基于多个事实进行的解释性归纳 | `【推断】` | 支撑事实、推断边界、置信度、待验证项 |\r\n\r\n不属于以上三类，或不能提供证据引用的内容，不进入最终报告。\r\
          \n\r\n### 2.2 统一证据引用协议\r\n\r\n每条结论必须绑定 `evidence_refs`。\r\n\r\n```json\r\
          \n{\r\n  \"conclusion_id\": \"S3-P1-C01\",\r\n  \"conclusion_type\": \"\
          data_fact | rule_result | inference\",\r\n  \"statement\": \"结论文本\",\r\n\
          \  \"evidence_refs\": [\r\n    {\r\n      \"source_type\": \"metric | rule\"\
          ,\r\n      \"source_id\": \"channel_month_metrics\",\r\n      \"metric\"\
          : \"cost_share\",\r\n      \"dimension\": {\r\n        \"channel_group\"\
          : \"PAID_EXTERNAL\"\r\n      },\r\n      \"period\": {\r\n        \"start\"\
          : \"YYYY-MM\",\r\n        \"end\": \"YYYY-MM\"\r\n      },\r\n      \"value\"\
          : 0.0,\r\n      \"unit\": \"RATIO\"\r\n    }\r\n  ],\r\n  \"inference_label\"\
          : null,\r\n  \"confidence\": \"high | medium\",\r\n  \"unverified_items\"\
          : []\r\n}\r\n```\r\n\r\n约束：\r\n\r\n- `data_fact` 和 `rule_result` 不得包含模型生成的业务原因。\r\
          \n- `inference` 的正文必须以“推断：”开头。\r\n- 推断只能描述现象之间可能存在的关系，不能断言因果。\r\n- 没有证据引用的结论在渲染前直接拦截。\r\
          \n- 原始值、比例、环比、同比均由指标层计算，LLM 不自行运算。\r\n\r\n### 2.3 渠道分类前置条件\r\n\r\n当前指标层未提供版本化渠道分类表，五屏均不使用\
          \ `acquisition_source_type`，全部按 `month + channel`（三级渠道）或 `month + category`（品类）聚合。渠道类型分类表：\r\
          \n\r\n| 编码 | 含义 |\r\n| --- | --- |\r\n| `PAID_EXTERNAL` | 外部付费 |\r\n| `INTERNAL_TRANSFER`\
          \ | 内部流转 |\r\n| `REFERRAL` | 转介绍 |\r\n| `NATURAL` | 自然获客 |\r\n| `UNCLASSIFIED`\
          \ | 未分类 |\r\n\r\n待以下版本化渠道分类表接入后，可在此基础上恢复渠道类型结构分解：\r\n\r\n```text\r\nchannel\r\
          \nacquisition_source_type\r\neffective_start\r\neffective_end\r\nmapping_version\r\
          \nmapping_basis\r\n```\r\n\r\n在渠道分类表接入前，不得让 LLM 根据渠道名称猜测其属于内部、外部、转介绍或自然渠道。\r\
          \n\r\n### 2.4 通用数据质量字段\r\n\r\n每一屏都应包含以下数据质量信息：\r\n\r\n```text\r\ndata_period_start\r\
          \ndata_period_end\r\ncomplete_months\r\nincomplete_months\r\nmissing_fields\r\
          \nunsupported_metrics\r\nunsupported_rules\r\n```\r\n\r\n不完整月份可以展示，但不得参与跨月趋势规则。\r\
          \n\r\n---\r\n\r\n## 3. 第一屏：渠道全景\r\n\r\n### 3.1 分析目标\r\n\r\n回答三个事实问题：\r\n\
          \r\n- 当前获客由哪些三级渠道构成，规模分布如何。\r\n- 各渠道的成本、线索、首单量和收入占比如何。\r\n- 整体及主要渠道的规模与效率在观察期内如何变化。\r\
          \n\r\n本屏按 `month + channel`（三级渠道）聚合，不依赖渠道类型映射表；渠道类型（外部付费/内部流转/转介绍/自然获客/未分类）结构分解待版本化分类表接入后再恢复。本屏只描述全局渠道结构，不解释变化原因。\r\
          \n\r\n### 3.2 需要输入的数据字段\r\n\r\n基础字段：\r\n\r\n```text\r\nmonth\r\nis_complete_month\r\
          \nchannel\r\ncost\r\nleads\r\nfirst_order_orders\r\nfirst_order_revenue\r\
          \nfirst_order_net_revenue\r\n```\r\n\r\n指标层派生字段：\r\n\r\n```text\r\ncost_share\r\
          \nlead_share\r\nfirst_order_share\r\nrevenue_share\r\ncac\r\ncac_rate\r\n\
          first_order_conversion_rate\r\nchannel_roi\r\n```\r\n\r\n口径限制：\r\n\r\n-\
          \ `first_order_orders` 只能作为首购用户代理，不能称为去重客户数。\r\n- 趋势只使用完整、连续月份。\r\n\r\n\
          ### 3.3 可使用的规则结果\r\n\r\n- R61：无效投放。\r\n- R48：外部投放 ROI 亏损，仅在规则实际执行后使用。\r\n\
          - R49：内部获客 ROI 健康，仅在规则实际执行后使用。\r\n- 渠道集中度和付费获客占比等一期优先作为指标事实，不得冒充已执行规则。\r\
          \n\r\n### 3.4 LLM 允许推理范围\r\n\r\n允许：\r\n\r\n- 根据结构占比描述“集中”“分散”或“主要由某类渠道构成”。\r\
          \n- 根据连续期间数据描述“上升”“下降”或“波动”。\r\n- 比较获客量趋势与转化效率趋势是否同向。\r\n- 将“高占比 + 明显波动”标记为结构稳定性关注项。\r\
          \n\r\n合规句式：\r\n\r\n> 【推断】从渠道占比和期间波动看，该渠道类型可能是整体获客稳定性的主要敏感项。\r\n\r\n### 3.5\
          \ 禁止推理内容\r\n\r\n禁止：\r\n\r\n- 将获客量下降归因于平台算法、竞争加剧、素材疲劳或预算不足。\r\n- 将相关性表达为因果关系。\r\
          \n- 把首单订单数称为去重客户数。\r\n- 根据渠道名称自行识别渠道属于内部、外部、转介绍或自然获客。\r\n- 仅凭首单 ROI 判断完整商业模式是否盈利。\r\
          \n- 使用不完整月份生成长期趋势结论。\r\n\r\n### 3.6 输出格式\r\n\r\n```json\r\n{\r\n  \"screen_id\"\
          : \"S3-P1\",\r\n  \"title\": \"渠道全景\",\r\n  \"period\": {},\r\n  \"data_quality\"\
          : {},\r\n  \"channel_mix_table\": [],\r\n  \"trend_series\": [],\r\n  \"\
          conclusions\": [],\r\n  \"data_gaps\": []\r\n}\r\n```\r\n\r\n建议视觉组件：\r\n\
          \r\n- 渠道结构占比卡片。\r\n- 成本、线索、首单量结构图。\r\n- 月度规模与效率趋势图。\r\n- 最多三条有证据的观察结论。\r\
          \n\r\n---\r\n\r\n## 4. 第二屏：品类营收结构\r\n\r\n### 4.1 分析目标\r\n\r\n集中展示 S3 规则的：\r\
          \n\r\n回答：品类营收的下行是个别现象还是整体趋势，品类之间是否出现分化。\r\n\r\n本屏分析对象是品类首单营收，不涉及渠道。\r\n\r\
          \n### 4.2 需要输入的数据字段\r\n\r\n```text\r\nmonth\r\ncategory\r\nis_complete_month\r\
          \ncategory_revenue\r\nrevenue_share\r\n```\r\n\r\nRule Result 字段（module=S1）：\r\
          \n\r\n```text\r\nrule_id\r\nrule_name\r\nhit\r\ndimension.type\r\ndimension.name\r\
          \nperiod.start\r\nperiod.end\r\nmetrics\r\nthreshold\r\nevidence\r\n```\r\
          \n\r\n### 4.3 可使用的规则结果\r\n\r\n当前规则引擎实际可执行：\r\n\r\n- R3：营收集中度（Top1品类首单营收占比\
          \ > 0.50）。\r\n- R4：营收过于分散（Top3品类首单营收占比 < 0.50）。\r\n- R5：核心品类下行趋势（连续3个完整月下降）。\r\
          \n- R8：涨跌两极分化（同时存在环比 >30% 与 <-30%）。\r\n- R9：系统性下跌（> 3个品类连续3个完整月下降）。\r\n\r\
          \n参考报告使用的 R15、R17、R18 等编号与当前规则总表及执行引擎不一致，不得沿用。\r\n\r\n### 4.4 LLM 允许推理范围\r\
          \n\r\n允许：\r\n\r\n- 复述规则是否命中。\r\n- 将多个品类的 R5 命中归纳为整体性下行表现（结合 R9）。\r\n- 对命中规则按覆盖品类数、持续月份排序。\r\
          \n- 说明规则未执行是因为缺字段或不满足计算条件。\r\n\r\n### 4.5 禁止推理内容\r\n\r\n禁止：\r\n\r\n- 修改规则阈值，自行重算规则是否命中。\r\
          \n- 将 `hit=false` 解释为“业务健康”。\r\n- 根据品类名称判断“获客型”“深耕型”等经营类型，除非业务提供正式标签。\r\n\
          - 把首单营收等同于整体收入或利润。\r\n- 引用 R8 的极端增速时，不说明基数是否极小，直接当作重要变化。\r\n- 根据一条规则命中创造业务原因。\r\
          \n\r\n### 4.6 输出格式\r\n\r\n```json\r\n{\r\n  \"screen_id\": \"S3-P2\",\r\n\
          \  \"title\": \"品类营收结构\",\r\n  \"category_revenue_table\": [],\r\n  \"declining_categories\"\
          : [],\r\n  \"conclusions\": [],\r\n  \"data_gaps\": []\r\n}\r\n```\r\n\r\
          \n---\r\n\r\n## 5. 第三屏：获客成本信号\r\n\r\n### 5.1 分析目标\r\n\r\n识别：\r\n\r\n- 哪些渠道的获客成本出现持续性上行。\r\
          \n- 持续上行与单期跳升的区别与覆盖范围。\r\n- 需要优先复核的渠道清单。\r\n\r\n本屏分析对象是渠道 CAC 率，不涉及客户结构。代码中\
          \ R36/R37 的 module 标为 S2，但事实语义是渠道获客成本，报告标题不写“客户结构”。\r\n\r\n### 5.2 需要输入的数据字段\r\
          \n\r\n```text\r\nmonth\r\nchannel\r\ncac_rate\r\n```\r\n\r\nRule Result\
          \ 字段（module=S2）：\r\n\r\n```text\r\nrule_id\r\nrule_name\r\nhit\r\ndimension.type\r\
          \ndimension.name\r\nperiod.start\r\nperiod.end\r\nmetrics\r\nthreshold\r\
          \nevidence\r\n```\r\n\r\n### 5.3 可使用的规则结果\r\n\r\n- R36：CAC连续上升（连续3个完整月上升）。\r\
          \n- R37：CAC环比跳升（单期环比 > 0.05，即5个百分点）。\r\n\r\n### 5.4 LLM 允许推理范围\r\n\r\n允许：\r\
          \n\r\n- 复述规则是否命中。\r\n- 将多个渠道的同类命中归纳为共同风险表现。\r\n- 同一渠道同时命中 R36 与 R37 时，合并表述为需要优先复核，不重复列两次。\r\
          \n- 对命中渠道按覆盖范围、持续月份或变化幅度排序。\r\n\r\n### 5.5 禁止推理内容\r\n\r\n禁止：\r\n\r\n- 修改规则阈值，自行重算规则是否命中。\r\
          \n- 将 `hit=false` 解释为“业务健康”。\r\n- 把本屏标题写成“客户结构”。\r\n- 推断成本上行的原因（平台竞价、素材衰退、预算不足、投放策略失误等）。\r\
          \n- 给出停投、加投或预算调整结论。\r\n\r\n### 5.6 输出格式\r\n\r\n```json\r\n{\r\n  \"screen_id\"\
          : \"S3-P3\",\r\n  \"title\": \"获客成本信号\",\r\n  \"signal_summary_table\":\
          \ [],\r\n  \"sustained_increase_channels\": [],\r\n  \"priority_review_list\"\
          : [],\r\n  \"conclusions\": [],\r\n  \"data_gaps\": []\r\n}\r\n```\r\n\r\
          \n---\r\n\r\n## 6. 第四屏：投放有效性\r\n\r\n### 6.1 分析目标\r\n\r\n回答：无效投放（ROI<0.5\
          \ 渠道消耗占比）风险当前是否触发，覆盖范围是什么。\r\n\r\n本屏只讨论低效消耗占比这一项风险，不讨论渠道集中度、付费与自然流量结构。\r\
          \n\r\n### 6.2 需要输入的数据字段\r\n\r\n```text\r\nmonth\r\nineffective_cost\r\n\
          total_cost\r\nineffective_cost_share\r\n```\r\n\r\n### 6.3 可使用的规则结果\r\n\r\
          \n- R61：无效投放(P0)（ROI<0.5渠道消耗占比 > 0.20）。\r\n\r\n### 6.4 LLM 允许推理范围\r\n\r\n\
          允许：\r\n\r\n- 复述规则是否命中。\r\n- 根据连续月份数据描述低效消耗规模是扩大还是缩小。\r\n- 说明本屏结论只覆盖低效消耗占比这一项。\r\
          \n\r\n### 6.5 禁止推理内容\r\n\r\n禁止：\r\n\r\n- 修改规则阈值，自行重算是否命中。\r\n- 将未命中写成“投放整体健康”或“渠道结构没有问题”。\r\
          \n- 不说明本屏结论的覆盖边界，直接推广为渠道结构整体判断。\r\n\r\n### 6.6 输出格式\r\n\r\n```json\r\n{\r\
          \n  \"screen_id\": \"S3-P4\",\r\n  \"title\": \"投放有效性\",\r\n  \"check_result_table\"\
          : [],\r\n  \"coverage_boundary\": [],\r\n  \"conclusions\": [],\r\n  \"\
          data_gaps\": []\r\n}\r\n```\r\n\r\n---\r\n\r\n## 7. 第五屏：总结\r\n\r\n### 7.1\
          \ 分析目标\r\n\r\n将前四屏已经生成并通过证据校验的内容压缩为：\r\n\r\n- 核心事实。\r\n- 规则风险。\r\n- 受限推断。\r\
          \n- 数据盲区。\r\n- 后续验证方向。\r\n\r\n第五屏不能产生前四屏从未出现的新结论。\r\n\r\n### 7.2 需要输入的数据字段\r\
          \n\r\n总结屏不重新读取明细数据，只消费前四屏的结构化输出：\r\n\r\n```text\r\nscreen_id\r\nconclusion_id\r\
          \nconclusion_type\r\nstatement\r\nevidence_refs\r\nrule_id\r\nseverity\r\
          \nconfidence\r\nunverified_items\r\ndata_gaps\r\n```\r\n\r\n用于排序的可选字段：\r\
          \n\r\n```text\r\naffected_cost\r\naffected_leads\r\naffected_first_orders\r\
          \naffected_categories\r\nduration_months\r\n```\r\n\r\n### 7.3 可使用的规则结果\r\
          \n\r\n只能使用前四屏已经验证的规则状态：\r\n\r\n- `HIT`\r\n- `NOT_HIT`\r\n- `NOT_EXECUTABLE`\r\
          \n\r\n不得在总结阶段自行调用或重算规则。\r\n\r\n### 7.4 LLM 允许推理范围\r\n\r\n允许：\r\n\r\n- 合并重复结论。\r\
          \n- 按覆盖范围、持续时间和规则优先级排序。\r\n- 区分“已确认事实”和“待验证推断”。\r\n- 根据证据覆盖度给出高、中置信度。\r\n\
          - 将数据缺口转化为明确的验证问题。\r\n\r\n### 7.5 禁止推理内容\r\n\r\n禁止：\r\n\r\n- 生成新的业务原因。\r\
          \n- 生成未经数据支持的战略动作。\r\n- 把“可能”改写成确定性结论。\r\n- 把规则未命中写成“没有风险”。\r\n- 把数据缺失写成“指标为零”。\r\
          \n- 输出“优化投放、加强品牌、调整 KPI”等泛化建议，除非另行进入行动方案阶段。\r\n\r\n### 7.6 输出格式\r\n\r\n\
          ```json\r\n{\r\n  \"screen_id\": \"S3-P5\",\r\n  \"title\": \"总结\",\r\n\
          \  \"confirmed_facts\": [],\r\n  \"rule_findings\": [],\r\n  \"inferences\"\
          : [],\r\n  \"data_gaps\": [],\r\n  \"verification_priorities\": [],\r\n\
          \  \"coverage\": {\r\n    \"screens_used\": [],\r\n    \"evidence_count\"\
          : 0,\r\n    \"unsupported_conclusion_count\": 0\r\n  }\r\n}\r\n```\r\n\r\
          \n总结屏固定展示四个栏目：\r\n\r\n| 栏目 | 内容来源 |\r\n| --- | --- |\r\n| 已确认事实 | 数据指标 |\r\
          \n| 已命中、未命中规则 | Rule Engine |\r\n| 推断 | 前四屏已标注的推断 |\r\n| 待验证问题 | 数据盲区或推断所需的补充数据\
          \ |\r\n\r\n---\r\n\r\n## 8. 报告生成链路\r\n\r\n```text\r\n渠道明细数据\r\n  → 字段标准化\r\
          \n  → 月 × 渠道 / 月 × 品类聚合\r\n  → 指标计算\r\n  → S3 Rule Engine\r\n  → 证据对象\r\n\
          \  → 五屏内容生成器\r\n  → 结论追溯校验\r\n  → 屏幕 JSON\r\n  → 前端渲染\r\n```\r\n\r\n各层职责必须分离：\r\
          \n\r\n| 层级 | 职责 |\r\n| --- | --- |\r\n| 字段标准化层 | 将源字段映射为标准业务字段并校验缺列、类型和空值\
          \ |\r\n| 指标层 | 聚合基础数值并计算比例、趋势和效率指标 |\r\n| 规则层 | 根据固定规则和阈值判断是否命中 |\r\n| LLM\
          \ 层 | 组织语言、执行受限归纳、标注推断 |\r\n| 校验层 | 拦截无证据结论、越界因果和错误规则状态 |\r\n| 前端层 | 渲染结构化屏幕结果，不重新计算指标或规则\
          \ |\r\n\r\n---\r\n\r\n## 9. Prompt 输入契约\r\n\r\nLLM 每次只接收单屏所需的最小上下文：\r\n\r\
          \n```json\r\n{\r\n  \"screen_contract\": {},\r\n  \"period\": {},\r\n  \"\
          data_quality\": {},\r\n  \"metrics\": [],\r\n  \"rule_results\": [],\r\n\
          \  \"allowed_inferences\": [],\r\n  \"forbidden_inferences\": [],\r\n  \"\
          required_output_schema\": {}\r\n}\r\n```\r\n\r\n系统提示必须明确：\r\n\r\n1. 不重新计算输入数值。\r\
          \n2. 不修改规则命中状态。\r\n3. 不创建输入中不存在的指标、事实或规则。\r\n4. 不推断业务原因。\r\n5. 所有推断必须带“推断：”前缀。\r\
          \n6. 每条输出结论必须引用 `evidence_refs`。\r\n7. 证据不足时输出 `data_gap`，不得补全故事。\r\n\r\n\
          ---\r\n\r\n## 10. 上线前强制校验\r\n\r\n每屏生成后必须执行以下检查：\r\n\r\n1. 每条结论都有唯一的 `conclusion_id`。\r\
          \n2. 每条结论至少有一个 `evidence_ref`。\r\n3. `rule_result` 必须关联真实存在的 `rule_id`。\r\
          \n4. `inference` 必须以“推断：”开头。\r\n5. 推断必须包含 `unverified_items`。\r\n6. 数值必须能够在指标层或规则结果中按原值定位。\r\
          \n7. 不允许 LLM 输出输入中不存在的新数值。\r\n8. 不允许 LLM 自行计算比例、环比或同比。\r\n9. 不允许出现“因为、导致、根因、说明了”等确定性因果表达，除非存在专门的因果证据。\r\
          \n10. `NOT_EXECUTABLE` 与 `NOT_HIT` 必须严格区分。\r\n11. 第五屏不得出现前四屏不存在的结论 ID。\r\
          \n12. `unsupported_conclusion_count` 必须为 0，报告才允许发布。\r\n\r\n---\r\n\r\n##\
          \ 11. 一期能力边界与待补数据\r\n\r\n### 11.1 当前可以直接使用\r\n\r\n- 月 × 三级渠道的成本、线索、首单订单和首单收入指标。\r\
          \n- 月 × 品类的首单营收和占比指标。\r\n- `cac`、`cac_rate`、首单转化率、渠道首单 ROI 等现有派生指标。\r\n\
          - 现有 Rule Result JSON 协议。\r\n- 当前实际执行的 S1 R3/R4/R5/R8/R9、S2 R36/R37、S3 R61\
          \ 规则结果。\r\n\r\n### 11.2 一期不生成（待字段补齐后恢复为独立屏）\r\n\r\n- 三级渠道到渠道类型的版本化映射（恢复后可在第一屏内做渠道类型结构分解）。\r\
          \n- 月 × 品类 × 渠道的交叉聚合表（恢复后可补齐「品类 × 渠道依赖度」屏）。\r\n- 内部流转的源品类—目标品类路径、去重客户数、流转率（恢复后可补齐「内部渠道」屏）。\r\
          \n- 转介绍人数、推荐关系、转介绍转化率（恢复后可补齐「转介绍」屏）。\r\n\r\n以上字段缺失期间，不生成对应内容，也不由 LLM 猜测补全。\r\
